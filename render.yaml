services:
  - type: web
    name: position-size-calculator
    env: ruby
    region: singapore
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: position-size-calculator-db
          property: connectionString
      - key: RAILS_MAX_THREADS
        value: 5

databases:
  - name: position-size-calculator-db
    region: singapore
    plan: free
    databaseName: position_size_calculator_production
    user: position_size_calculator
